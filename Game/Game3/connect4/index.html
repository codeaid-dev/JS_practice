<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4目並べ</title>
  <style>
    #panel {
      display: grid;
      grid-template-columns: repeat(7, 100px);
      grid-template-rows: repeat(6, 100px);
      gap: 10px;
      margin-top: 20px;
    }
    .card {
      width: 100px;
      height: 100px;
      background-color: #444;
      cursor: pointer;
      border-radius: 50%;
    }
    #result {
      font-size: 40px;
      color: 'black';
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>4目並べ</h1>
  <div id="panel"></div>
  <p id="result"></p>
</body>
</html>
