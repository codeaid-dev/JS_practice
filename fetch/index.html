<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript-fetch</title>
</head>
<body>
  <h1>JavaScript-fetch</h1>
  <table id="userlist">
    <tr>
      <th>ID</th>
      <th>名前</th>
    </tr>
  </table>
  <table id="awaitlist">
    <tr>
      <th>ID</th>
      <th>名前</th>
    </tr>
  </table>
  <table id="awaitlist2">
    <tr>
      <th>ID</th>
      <th>名前</th>
    </tr>
  </table>

  <script>
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const table = document.getElementById("userlist");
        for (let i=0; i<data.length; i++) {
          const tr = table.insertRow(-1);
          const td1 = tr.insertCell(-1);
          const td2 = tr.insertCell(-1);
          td1.innerHTML = data[i].id;
          td2.innerHTML = data[i].name;
        }
      });

    async function load() {
      const response = await fetch('data.json');
      const data = await response.json();
      const table = document.getElementById("awaitlist");
      for (let i=0; i<data.length; i++) {
        const tr = table.insertRow(-1);
        const td1 = tr.insertCell(-1);
        const td2 = tr.insertCell(-1);
        td1.innerHTML = data[i].id;
        td2.innerHTML = data[i].name;
      }
    }

    async function load2() {
      try {
        const response = await fetch('data2.json');
        if (!response.ok) {
          throw new Error(
          `情報を取得できませんでした ${response.status}`
          );
        }
        const data = await response.json();
        const table = document.getElementById("awaitlist2");
        for (let i=0; i<data.length; i++) {
          const tr = table.insertRow(-1);
          const td1 = tr.insertCell(-1);
          const td2 = tr.insertCell(-1);
          td1.innerHTML = data[i].id;
          td2.innerHTML = data[i].name;
        }
      }
      catch (error) {
        console.error(error.message);
      }
    }

    load();
    load2();

    async function send() {
      try {
        const response = await fetch('https://example.com/post', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ item: 'example' })
        });
        const result = await response.json();
        console.log('Success:', result);
      } catch (error) {
        console.error('Error:', error.message);
      }
    }

  </script>
</body>
</html>
